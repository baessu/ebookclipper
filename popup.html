<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #333;
    }
    .header {
      background: #2d2d2d;
      color: white;
      padding: 16px 20px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header p {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    .content {
      padding: 16px 20px;
    }

    /* Guide section */
    .guide {
      margin-bottom: 14px;
    }
    .guide-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #888;
      padding: 0;
      margin-bottom: 8px;
    }
    .guide-toggle:hover {
      color: #555;
    }
    .guide-toggle .arrow {
      font-size: 10px;
      transition: transform 0.2s;
      display: inline-block;
    }
    .guide-toggle.open .arrow {
      transform: rotate(90deg);
    }
    .guide-steps {
      display: none;
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .guide-steps.show {
      display: block;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 0;
    }
    .step + .step {
      border-top: 1px solid #f5f5f5;
    }
    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #4a90d9;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .step-text {
      font-size: 12px;
      line-height: 1.5;
      color: #555;
    }
    .step-text strong {
      color: #333;
    }
    .step-text code {
      background: #f0f0f0;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
      color: #c62828;
      word-break: break-all;
    }

    /* Page status badge */
    .page-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .page-badge.on-millie {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .page-badge.off-millie {
      background: #fff3e0;
      color: #e65100;
    }
    .page-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .page-badge.on-millie .dot {
      background: #4caf50;
    }
    .page-badge.off-millie .dot {
      background: #ff9800;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #4a90d9;
      color: white;
    }
    .btn-primary:hover {
      background: #3a7bc8;
    }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.error {
      display: block;
      background: #fce4ec;
      color: #c62828;
    }
    .status.info {
      display: block;
      background: #e3f2fd;
      color: #1565c0;
    }
    .preview {
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #555;
      white-space: pre-wrap;
      display: none;
    }
    .footer {
      padding: 10px 20px;
      border-top: 1px solid #eee;
      text-align: center;
    }
    .footer a {
      font-size: 11px;
      color: #aaa;
      text-decoration: none;
    }
    .footer a:hover {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 eBook 하이라이트 추출기</h1>
    <p>현재 밀리의 서재를 지원합니다</p>
  </div>
  <div class="content">
    <!-- 현재 페이지 상태 -->
    <div id="pageBadge" class="page-badge off-millie">
      <span class="dot"></span>
      <span id="pageBadgeText">페이지 확인 중...</span>
    </div>

    <!-- 사용 가이드 (접이식) -->
    <div class="guide">
      <button id="guideToggle" class="guide-toggle">
        <span class="arrow">▶</span> 사용 방법
      </button>
      <div id="guideSteps" class="guide-steps">
        <div class="step">
          <span class="step-num">1</span>
          <span class="step-text"><strong>밀리의 서재</strong>에 로그인합니다.</span>
        </div>
        <div class="step">
          <span class="step-num">2</span>
          <span class="step-text"><strong>서재 > 책 선택 > 하이라이트</strong> 탭으로 이동합니다.<br><code>/library/.../highlights/...</code></span>
        </div>
        <div class="step">
          <span class="step-num">3</span>
          <span class="step-text">아래 <strong>하이라이트 추출 & 복사</strong> 버튼을 클릭하면 끝!</span>
        </div>
      </div>
    </div>

    <button id="extractBtn" class="btn btn-primary">하이라이트 추출 & 복사</button>
    <div id="status" class="status"></div>
    <div id="preview" class="preview"></div>
  </div>
  <div class="footer">
    <a href="https://github.com/baessu/ebookclipper" target="_blank">GitHub</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
