<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #333;
    }
    .header {
      background: #2d2d2d;
      color: white;
      padding: 16px 20px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header p {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    .content {
      padding: 16px 20px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #4a90d9;
      color: white;
    }
    .btn-primary:hover {
      background: #3a7bc8;
    }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.error {
      display: block;
      background: #fce4ec;
      color: #c62828;
    }
    .status.info {
      display: block;
      background: #e3f2fd;
      color: #1565c0;
    }
    .preview {
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #555;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 밀리의 서재 하이라이트</h1>
    <p>하이라이트 페이지에서 실행해주세요</p>
  </div>
  <div class="content">
    <button id="extractBtn" class="btn btn-primary">하이라이트 추출 & 복사</button>
    <div id="status" class="status"></div>
    <div id="preview" class="preview"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
